name: RustGrid Agent

# rustgrid-workflow-version: 3

on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: RustGrid mission execution identifier
        required: true
        type: string
      dispatch_nonce:
        description: One-time dispatch correlation value
        required: true
        type: string
      agent_download_url:
        description: Immutable RustGrid agent artifact URL selected for this execution
        required: true
        type: string
      agent_sha256:
        description: SHA-256 digest of the selected RustGrid agent artifact
        required: true
        type: string

concurrency:
  group: rustgrid-${{ inputs.execution_id }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  execute:
    name: Execute RustGrid mission
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install RustGrid agent
        env:
          RUSTGRID_AGENT_DOWNLOAD_URL: ${{ inputs.agent_download_url }}
          RUSTGRID_AGENT_SHA256: ${{ inputs.agent_sha256 }}
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/rustgrid-agent.tar.gz"
          agent_path="$RUNNER_TEMP/rustgrid-agent"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --output "$archive_path" "$RUSTGRID_AGENT_DOWNLOAD_URL"
          printf '%s  %s\n' "$RUSTGRID_AGENT_SHA256" "$archive_path" | sha256sum --check --strict -
          test "$(tar --list --gzip --file "$archive_path")" = "rustgrid-agent"
          tar --extract --gzip --file "$archive_path" --directory "$RUNNER_TEMP" --no-same-owner --no-same-permissions
          test -f "$agent_path"
          test ! -L "$agent_path"
          chmod 0755 "$agent_path"

      - name: Authenticate and execute
        env:
          RUSTGRID_API_URL: https://app.rustgrid.com
          RUSTGRID_EXECUTION_ID: ${{ inputs.execution_id }}
          RUSTGRID_DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          RUSTGRID_OIDC_REQUEST_URL="$ACTIONS_ID_TOKEN_REQUEST_URL" \
          RUSTGRID_OIDC_REQUEST_TOKEN="$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$RUNNER_TEMP/rustgrid-agent" execute \
            --provider github-actions \
            --execution-id "$RUSTGRID_EXECUTION_ID"

      - name: Report emergency failure
        if: ${{ failure() || cancelled() }}
        env:
          RUSTGRID_API_URL: https://app.rustgrid.com
          RUSTGRID_EXECUTION_ID: ${{ inputs.execution_id }}
          RUSTGRID_DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
        run: |
          RUSTGRID_OIDC_REQUEST_URL="$ACTIONS_ID_TOKEN_REQUEST_URL" \
          RUSTGRID_OIDC_REQUEST_TOKEN="$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$RUNNER_TEMP/rustgrid-agent" report-emergency-failure \
            --provider github-actions \
            --execution-id "$RUSTGRID_EXECUTION_ID" || true
