[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Merged into zbus 6 rather than abandoned. They reach us only through
    # keyring's Linux Secret Service store, which still uses zbus 5. Remove
    # once keyring moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; pulled in by keyring" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; pulled in by keyring" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; pulled in by keyring" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
  # rustls/ring has not migrated to getrandom 0.4 yet.
  { name = "getrandom", version = "0.2.17" },
  # ring retains its older Windows compatibility layer.
  { name = "windows-sys", version = "0.52.0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
